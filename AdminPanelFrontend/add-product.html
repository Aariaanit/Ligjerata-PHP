<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Add Product</title>
    <link href="../DashboardNew2/css/styles.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
        <a class="navbar-brand ps-3" href="index.html">Admin Panel</a>
        <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle"><i class="fas fa-bars"></i></button>
    </nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-dark">
                <div class="sb-sidenav-menu">
                    <div class="nav">
                        <div class="sb-sidenav-menu-heading">Core</div>
                        <a class="nav-link" href="index.html">
                            <div class="sb-nav-link-icon"><i class="fas fa-gauge-high"></i></div>
                            Dashboard
                        </a>
                        <a class="nav-link" href="products.html">
                            <div class="sb-nav-link-icon"><i class="fas fa-box-open"></i></div>
                            Products
                        </a>
                        <a class="nav-link" href="add-product.html">
                            <div class="sb-nav-link-icon"><i class="fas fa-plus"></i></div>
                            Add Product
                        </a>
                    </div>
                </div>
            </nav>
        </div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Add Product</h1>
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="index.html">Dashboard</a></li>
                        <li class="breadcrumb-item active">Add Product</li>
                    </ol>
                    <div class="card mb-4">
                        <div class="card-header">
                            <i class="fas fa-pen-to-square me-1"></i>
                            Product Form
                        </div>
                        <div class="card-body">
                            <form>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Product Name</label>
                                        <input class="form-control" type="text" placeholder="Enter product name">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Category</label>
                                        <input class="form-control" type="text" placeholder="Enter category">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Price</label>
                                        <input class="form-control" type="number" placeholder="Enter price">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Stock</label>
                                        <input class="form-control" type="number" placeholder="Enter stock">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Product Image</label>
                                        <input class="form-control" type="file">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Description</label>
                                        <textarea class="form-control" rows="5" placeholder="Enter description"></textarea>
                                    </div>
                                </div>
                                <div class="mt-4 d-flex gap-2">
                                    <button class="btn btn-primary" type="button">Save</button>
                                    <a class="btn btn-outline-secondary" href="products.html">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="../DashboardNew2/js/scripts.js"></script>
</body>
</html>
